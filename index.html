<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Assignment Tracker & To-do List สไตล์ Modern Minimal โทนสีน้ำตาลอบอุ่น ช่วยจัดการและติดตามการส่งงานอย่างเป็นระบบ">
    <title>Mellow Tracker - Assignment Tracker & To-do List</title>
    <!-- Google Fonts: Outfit for English & Noto Sans Thai for Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for minimal icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <div class="header-main">
                <div class="logo-area">
                    <span class="logo-icon">☕</span>
                    <div class="title-group">
                        <h1 id="app-title">Mellow Tracker</h1>
                        <p id="app-subtitle">Assignment & Task Organizer</p>
                    </div>
                </div>
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="สลับโหมดหน้าจอ">
                    <i class="fa-solid fa-moon moon-icon"></i>
                    <i class="fa-solid fa-sun sun-icon"></i>
                </button>
            </div>
            
            <!-- Progress Section -->
            <div class="progress-card" id="progress-container">
                <div class="progress-info">
                    <span class="progress-title" id="progress-text-summary">กำลังทำได้ดี! เสร็จไปแล้ว 0%</span>
                    <span class="progress-count" id="progress-text-count">0 จาก 0 งาน</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar" style="width: 0%"></div>
                </div>
            </div>
        </header>

        <main class="app-main">
            <!-- Task Form Section -->
            <section class="form-section">
                <form id="task-form" class="task-form" autocomplete="off">
                    <div class="form-row">
                        <div class="input-group text-input-group">
                            <label for="task-input">ชื่องาน / การบ้าน</label>
                            <input type="text" id="task-input" placeholder="ทำการบ้านวิชาภาษาไทย, ออกแบบ UX/UI..." required>
                        </div>
                    </div>
                    
                    <div class="form-row form-row-split">
                        <div class="input-group">
                            <label for="task-due-date">กำหนดส่ง</label>
                            <input type="date" id="task-due-date" required>
                        </div>
                        <div class="input-group">
                            <label for="task-subject">วิชา / หมวดหมู่</label>
                            <select id="task-subject" required>
                                <option value="" disabled selected>กำลังโหลดวิชา...</option>
                            </select>
                        </div>
                        <div class="input-group btn-group-submit">
                            <button type="submit" id="btn-add-task" class="btn-primary">
                                <i class="fa-solid fa-plus"></i> เพิ่มงาน
                            </button>
                        </div>
                    </div>
                </form>
            </section>

            <!-- Filters and Sorting Section -->
            <section class="controls-section">
                <div class="filter-tabs" id="filter-tabs-container">
                    <button class="filter-tab active" data-filter="all" id="filter-all">
                        ทั้งหมด <span class="badge" id="badge-all">0</span>
                    </button>
                    <button class="filter-tab" data-filter="active" id="filter-active">
                        กำลังทำ <span class="badge" id="badge-active">0</span>
                    </button>
                    <button class="filter-tab" data-filter="completed" id="filter-completed">
                        เสร็จแล้ว <span class="badge" id="badge-completed">0</span>
                    </button>
                </div>
                <div class="sort-wrapper">
                    <label for="sort-select" class="sort-label"><i class="fa-solid fa-sort"></i> เรียงตาม</label>
                    <select id="sort-select" class="sort-select">
                        <option value="dueDate-asc">วันกำหนดส่ง (ใกล้สุดก่อน)</option>
                        <option value="dueDate-desc">วันกำหนดส่ง (ไกลสุดก่อน)</option>
                        <option value="subject-asc">วิชา (ก - ฮ)</option>
                        <option value="created-desc" selected>งานที่เพิ่มล่าสุด</option>
                    </select>
                </div>
            </section>

            <!-- Task List Section -->
            <section class="task-list-section">
                <div id="empty-state" class="empty-state">
                    <div class="empty-icon">☕</div>
                    <h3>ไม่มีงานที่ตรงกับตัวกรองนี้</h3>
                    <p>ชีวิตดีไม่มีงานตกค้าง... มาจิบกาแฟพักผ่อนกันเถอะ!</p>
                </div>
                <ul id="task-list" class="task-list">
                    <!-- Dynamic tasks will be inserted here -->
                </ul>
            </section>
        </main>
        
        <footer class="app-footer">
            <p>Mellow Tracker © 2026 • Modern Minimal Assignment Tracker</p>
            <p class="footer-note" id="connection-status">บันทึกข้อมูลแบบ Local Storage • สามารถเชื่อมโยงฐานข้อมูลในอนาคตได้</p>
        </footer>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
